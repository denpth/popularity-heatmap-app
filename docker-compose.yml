version: "3.9"        # compose spec version

services:
  api:
    build:
      context: .                   # project root is the build context
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"                # host → container
    environment:
      # Postgres connection string used by SQLAlchemy inside the container
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/visits
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # persist the cluster

volumes:
  pgdata:
